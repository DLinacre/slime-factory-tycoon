# .github/release.yml
# Controls how GitHub generates release notes

changelog:
  exclude:
    labels:
      - dependencies
      - duplicate
      - question
      - invalid
      - wontfix
  categories:
    - title: '🚀 New Features'
      labels:
        - enhancement
        - feature
    - title: '🐛 Bug Fixes'
      labels:
        - bug
        - fix
    - title: '📚 Documentation'
      labels:
        - documentation
        - docs
    - title: '🔧 Maintenance & Tooling'
      labels:
        - chore
        - ci
        - refactor
    - title: 'Other Changes'
      labels:
        - "*"

template: |
  ## What's Changed

  $CHANGES

  ## 📦 Download

  **[⬇ SlimeFactoryTycoon-v${{ env.VERSION }}.rbxlx](https://github.com/LIN4CRE/slime-factory-tycoon/releases/download/v${{ env.VERSION }}/SlimeFactoryTycoon-v${{ env.VERSION }}.rbxlx)**

  Open directly in Roblox Studio — no extra tools required.

  ## Quick Start

  ```bash
  git clone https://github.com/LIN4CRE/slime-factory-tycoon.git
  cd slime-factory-tycoon
  aftman install
  rojo serve
  ```

  ## Full Documentation

  - [README](https://github.com/LIN4CRE/slime-factory-tycoon#readme)
  - [DEVELOPMENT.md](https://github.com/LIN4CRE/slime-factory-tycoon/blob/main/DEVELOPMENT.md)
  - [CUSTOMIZING.md](https://github.com/LIN4CRE/slime-factory-tycoon/blob/main/CUSTOMIZING.md)
  - [STRATEGY.md](https://github.com/LIN4CRE/slime-factory-tycoon/blob/main/STRATEGY.md)

  **MIT licensed** — use commercially, keep all revenue.
